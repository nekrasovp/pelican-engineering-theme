[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pelican-engineering-theme"
version = "0.0.0.dev0"
description = "A reusable, accessibility-conscious Pelican theme for technical writers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pelican[markdown]>=4.11,<4.13",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Pelican",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/nekrasovp/pelican-engineering-theme"
Issues = "https://github.com/nekrasovp/pelican-engineering-theme/issues"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pelican_engineering_theme = [
  "theme/templates/*.html",
  "theme/static/css/*.css",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts", "tests"]
