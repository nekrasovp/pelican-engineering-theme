[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pelican-engineering-theme"
version = "0.1.0"
description = "A reusable, accessibility-conscious Pelican theme for technical writers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["pelican", "theme", "technical-writing", "jupyter", "accessibility"]
dependencies = [
  "pelican[markdown]>=4.11,<4.13",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Pelican",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: Text Processing :: Markup :: HTML",
]

[project.urls]
Changelog = "https://github.com/nekrasovp/pelican-engineering-theme/blob/main/CHANGELOG.md"
Documentation = "https://github.com/nekrasovp/pelican-engineering-theme/tree/main/docs"
Source = "https://github.com/nekrasovp/pelican-engineering-theme"
Repository = "https://github.com/nekrasovp/pelican-engineering-theme"
Issues = "https://github.com/nekrasovp/pelican-engineering-theme/issues"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "playwright>=1.55,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pelican_engineering_theme = [
  "theme/templates/*.html",
  "theme/templates/includes/*.html",
  "theme/static/css/*.css",
  "theme/static/js/*.js",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
markers = [
  "browser: real Chromium acceptance; requires PET_RUN_BROWSER=1 and a browser binary",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts", "tests"]
