name: Foundation docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate foundation contracts and implementation boundaries
        run: python3 scripts/validate_foundation.py
      - name: Validate all documentation links and screenshot provenance
        run: python3 scripts/validate_docs.py --external
      - name: Validate explicit protected publication policy
        run: python3 scripts/validate_release_policy.py
