name: Browser acceptance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  chromium:
    name: Chromium shell, accessibility, and color-mode acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync exact lock
        run: uv sync --locked --all-groups
      - name: Install locked accessibility scanner for this job only
        run: npm ci --ignore-scripts
      - name: Install Chromium for this job only
        run: uv run --locked --all-groups playwright install --with-deps chromium
      - name: Run real-browser acceptance and capture deterministic evidence
        env:
          PET_RUN_BROWSER: "1"
          PET_SCREENSHOT_DIR: artifacts/theme004-browser
          PET_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          uv run --locked --all-groups pytest -m browser
          tests/test_browser_acceptance.py -q
      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: theme004-browser-evidence
          path: artifacts/theme004-browser/**
          if-no-files-found: error
          retention-days: 14
