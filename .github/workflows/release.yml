name: Publish reviewed release

on:
  release:
    types: [published]
  # One-shot recovery for v0.1.0. Remove after the protected publish succeeds.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'release' && github.event.release.tag_name || 'v0.1.0' }}
  cancel-in-progress: false

jobs:
  build-candidate:
    name: Rebuild and verify exact release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'v0.1.0' }}
      - name: Prove tag, version, and exact release source
        env:
          PET_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'release' && github.sha || '463cce15e4b0963420ac0886e0522f4efc0cbf8f' }}
          PET_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'v0.1.0' }}
        shell: bash
        run: |
          actual_source_sha="$(git rev-parse HEAD)"
          test "${actual_source_sha}" = "${PET_EXPECTED_SOURCE_SHA}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${PET_RELEASE_TAG}" = "v${version}"
          test "$(git rev-list -n 1 "${PET_RELEASE_TAG}")" = "${actual_source_sha}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.28"
      - name: Sync exact lock
        run: uv sync --locked --all-groups
      - name: Install locked accessibility scanner
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: uv run --locked --all-groups playwright install --with-deps chromium
      - name: Run complete static and non-browser gates
        run: |
          uv run --locked --all-groups pytest
          uv run --locked --all-groups ruff check .
          uv run --locked --all-groups mypy
          uv run --locked --all-groups python scripts/validate_foundation.py
          uv run --locked --all-groups python scripts/validate_docs.py --external
          uv run --locked --all-groups python scripts/validate_release_policy.py
      - name: Run full browser, axe, print, and no-network acceptance
        env:
          PET_RUN_BROWSER: "1"
          PET_SCREENSHOT_DIR: artifacts/release-browser
          PET_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'release' && github.sha || '463cce15e4b0963420ac0886e0522f4efc0cbf8f' }}
        run: >-
          uv run --locked --all-groups pytest -m browser
          tests/test_browser_acceptance.py -q
      - name: Build the candidate twice and reject byte drift
        env:
          PET_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'release' && github.sha || '463cce15e4b0963420ac0886e0522f4efc0cbf8f' }}
        run: >-
          uv run --locked --all-groups python scripts/release_candidate.py build
          --dist dist --report artifacts/release-candidate.json
          --expected-source-sha "${PET_EXPECTED_SOURCE_SHA}"
      - name: Verify exact wheel and sdist inventories
        run: uv run --locked --all-groups python scripts/verify_distribution.py dist
      - name: Upload immutable candidate for protected publication jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: theme007-release-candidate-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            artifacts/release-candidate.json
            scripts/release_candidate.py
          if-no-files-found: error
          retention-days: 14
      - name: Retain exact-head browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: theme007-release-browser-${{ github.sha }}
          path: artifacts/release-browser/**
          if-no-files-found: error
          retention-days: 14

  attach-github-release:
    name: Attach immutable GitHub Release assets
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-release
      url: ${{ github.event.release.html_url || 'https://github.com/nekrasovp/pelican-engineering-theme/releases/tag/v0.1.0' }}
    permissions:
      contents: write
    steps:
      - name: Download exact candidate without checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: theme007-release-candidate-${{ github.sha }}
      - name: Recheck candidate source and hashes
        env:
          PET_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'release' && github.sha || '463cce15e4b0963420ac0886e0522f4efc0cbf8f' }}
        run: >-
          python scripts/release_candidate.py verify --dist dist
          --report artifacts/release-candidate.json
          --expected-source-sha "${PET_EXPECTED_SOURCE_SHA}"
      - name: Attach without overwriting an existing release asset
        env:
          GH_TOKEN: ${{ github.token }}
          PET_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'v0.1.0' }}
        run: >-
          gh release upload --repo "${GITHUB_REPOSITORY}" "${PET_RELEASE_TAG}"
          dist/*.whl dist/*.tar.gz
          artifacts/release-candidate.json

  publish-pypi:
    name: Publish exact files through PyPI Trusted Publishing
    needs: [build-candidate, attach-github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/pelican-engineering-theme
    permissions:
      id-token: write
    steps:
      - name: Download exact candidate without checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: theme007-release-candidate-${{ github.sha }}
      - name: Recheck candidate source and hashes
        env:
          PET_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'release' && github.sha || '463cce15e4b0963420ac0886e0522f4efc0cbf8f' }}
        run: >-
          python scripts/release_candidate.py verify --dist dist
          --report artifacts/release-candidate.json
          --expected-source-sha "${PET_EXPECTED_SOURCE_SHA}"
      - name: Publish immutable distributions with OIDC
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1 at 2026-07-22
        with:
          packages-dir: dist/
