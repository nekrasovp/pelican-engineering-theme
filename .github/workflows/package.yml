name: Package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  locked:
    name: Locked validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.28"
      - name: Sync exact lock
        run: uv sync --locked --all-groups
      - name: Test
        run: uv run --locked --all-groups pytest
      - name: Lint
        run: uv run --locked --all-groups ruff check .
      - name: Type check
        run: uv run --locked --all-groups mypy
      - name: Preserve foundation and scope boundaries
        run: uv run --locked --all-groups python scripts/validate_foundation.py
      - name: Validate documentation and screenshot provenance
        run: uv run --locked --all-groups python scripts/validate_docs.py --external
      - name: Prove publication remains explicit and protected
        run: uv run --locked --all-groups python scripts/validate_release_policy.py
      - name: Verify immutable notebook fragment input
        run: >-
          uv run --locked --all-groups python
          scripts/validate_notebook_contract.py
          tests/fixtures/plugin003-nbconvert-basic-v1/representative.fragment.html

  compatibility:
    name: Python ${{ matrix.python }} / Pelican ${{ matrix.pelican }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        pelican: ["4.11.0", "4.12.0"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --locked --all-groups --python "${{ matrix.python }}"
      - name: Select exact Pelican version
        run: uv pip install --python .venv/bin/python "pelican==${{ matrix.pelican }}"
      - name: Show executable versions
        run: .venv/bin/python -c "import platform, pelican; print(platform.python_version(), pelican.__version__)"
      - name: Run smoke and package tests
        run: .venv/bin/python -m pytest

  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.28"
      - name: Sync exact lock
        run: uv sync --locked --all-groups
      - name: Build sdist and wheel twice from the exact head
        env:
          PET_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          uv run --locked --all-groups python scripts/release_candidate.py build
          --dist dist --report artifacts/release-candidate.json
          --expected-source-sha "${PET_EXPECTED_SOURCE_SHA}"
      - name: Verify identity, metadata, and package data
        run: uv run --locked --all-groups python scripts/verify_distribution.py dist
      - name: Upload wheel, sdist, exact-source report, README, and examples
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: theme007-release-candidate
          path: |
            dist/*.whl
            dist/*.tar.gz
            artifacts/release-candidate.json
            README.md
            examples/minimal/**
            examples/full/**
            scripts/__init__.py
            scripts/release_candidate.py
            scripts/validate_content.py
            scripts/validate_shell.py
            scripts/verify_readme_onboarding.py
          if-no-files-found: error
          retention-days: 14

  installed-wheel:
    name: Artifact-only installed-wheel build
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Download build evidence without a repository checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: theme007-release-candidate
      - name: Install only the wheel and copy the generic examples
        shell: bash
        run: |
          proof_root="${RUNNER_TEMP}/pet-external-proof"
          uv venv --python 3.13 "${proof_root}/.venv"
          proof_python="${proof_root}/.venv/bin/python"
          wheel=(dist/*.whl)
          test "${#wheel[@]}" -eq 1
          uv pip install --python "${proof_python}" "${wheel[0]}"
          cp -R examples "${proof_root}/examples"
      - name: Prove the import comes from site-packages
        shell: bash
        run: |
          proof_root="${RUNNER_TEMP}/pet-external-proof"
          proof_python="${proof_root}/.venv/bin/python"
          cd "${proof_root}"
          env -u PYTHONPATH "${proof_python}" -I - <<'PY'
          import pathlib
          import sysconfig

          import pelican_engineering_theme as theme

          module = pathlib.Path(theme.__file__).resolve()
          purelib = pathlib.Path(sysconfig.get_paths()["purelib"]).resolve()
          assert module.is_relative_to(purelib), (module, purelib)
          assert theme.get_theme_path().is_dir()
          print(f"import={module}")
          print(f"theme={theme.get_theme_path()}")
          PY
      - name: Build both fixtures from the installed wheel outside the checkout
        shell: bash
        run: |
          artifact_root="$PWD"
          proof_root="${RUNNER_TEMP}/pet-external-proof"
          proof_python="${proof_root}/.venv/bin/python"
          for example in minimal full; do
            cd "${proof_root}/examples/${example}"
            env -u PYTHONPATH "${proof_python}" -I -m pelican content \
              -s pelicanconf.py -o output
            test -f output/index.html
            test -f output/theme/css/scaffold.css
            test -f output/theme/js/theme.js
          done
          test -f "${proof_root}/examples/minimal/output/small-technical-note.html"
          test -f "${proof_root}/examples/full/output/configurable-shell.html"
          test -f "${proof_root}/examples/full/output/404.html"
          test -f "${proof_root}/examples/full/output/archives.html"
          test -f "${proof_root}/examples/full/output/categories.html"
          test -f "${proof_root}/examples/full/output/category/guides.html"
          test -f "${proof_root}/examples/full/output/tags.html"
          test -f "${proof_root}/examples/full/output/tag/example.html"
          test -f "${proof_root}/examples/full/output/authors.html"
          test -f "${proof_root}/examples/full/output/author/example-editors.html"
          test -f "${proof_root}/examples/full/output/pages/about.html"
          test -f "${proof_root}/examples/full/output/index2.html"
          test -f "${proof_root}/examples/full/output/index3.html"
          test -f "${proof_root}/examples/full/output/notebook-presentation.html"
          test -f "${proof_root}/examples/full/output/downloads/theme006-notebook.ipynb"
          grep -q 'pet-notebook-region' \
            "${proof_root}/examples/full/output/notebook-presentation.html"
          grep -q 'pet-notebook-source-link' \
            "${proof_root}/examples/full/output/notebook-presentation.html"
          "${proof_python}" -I "${artifact_root}/scripts/validate_shell.py" \
            "${proof_root}/examples/minimal/output" \
            "${proof_root}/examples/full/output"
          cd "${artifact_root}"
          env -u PYTHONPATH "${proof_python}" -m scripts.validate_content \
            "${proof_root}/examples/minimal/output" \
            "${proof_root}/examples/full/output"

  readme-onboarding:
    name: README-only exact ${{ matrix.artifact }} onboarding
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        artifact: [wheel, sdist]
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Download candidate without a repository checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: theme007-release-candidate
      - name: Install exact candidate and build only README file blocks
        env:
          PET_ARTIFACT_KIND: ${{ matrix.artifact }}
        shell: bash
        run: |
          if test "${PET_ARTIFACT_KIND}" = "wheel"; then
            candidates=(dist/*.whl)
          else
            candidates=(dist/*.tar.gz)
          fi
          test "${#candidates[@]}" -eq 1
          python scripts/verify_readme_onboarding.py \
            --readme README.md --artifact "${candidates[0]}" --python 3.13

  clean-sdist:
    name: Clean unpacked-sdist tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Download the sdist without a repository checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: theme007-release-candidate
      - name: Install the exact sdist and run its unpacked tests
        shell: bash
        run: |
          sdists=(dist/*.tar.gz)
          test "${#sdists[@]}" -eq 1
          test -f "${sdists[0]}"
          bootstrap_root="${RUNNER_TEMP}/pet-sdist-bootstrap"
          mkdir -p "${bootstrap_root}"
          tar -xzf "${sdists[0]}" -C "${bootstrap_root}"
          gates=("${bootstrap_root}"/*/scripts/verify_clean_sdist.py)
          test "${#gates[@]}" -eq 1
          test -f "${gates[0]}"
          env -u PYTHONPATH python -I "${gates[0]}" \
            "${sdists[0]}" --python 3.13
